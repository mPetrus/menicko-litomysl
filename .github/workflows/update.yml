name: Update menus

on:
  schedule:
    - cron: "0 6,9 * * 1-5"  # UTC: 7:00 and 10:00 Prague time in winter (8:00/11:00 in summer)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # GitHub disables scheduled workflows after 60 days without commits; re-enabling keeps it alive
      - run: gh workflow enable update.yml
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Download the published menus (fallback when a restaurant fails)
        run: curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/menus.json" -o site/menus.json || true
      - run: python -m scraper.run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
