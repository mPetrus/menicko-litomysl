name: Update menus

on:
  schedule:
    - cron: "0 6,9 * * 1-5"  # UTC: 7:00 and 10:00 Prague time in winter (8:00/11:00 in summer)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub disables scheduled workflows after 60 days without commits; re-enabling keeps it alive
      - run: gh workflow enable update.yml
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install OCR for menus published as images (Karlov, Plums)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr-ces imagemagick
      - run: python -m pytest -q
      - name: Download the published menus (fallback when a restaurant fails)
        run: curl -sf "https://menicko-litomysl.pages.dev/menus.json" -o site/menus.json || true
      - run: python -m scraper.run
      # Cloudflare Pages (https://menicko-litomysl.pages.dev); token and account id are repository secrets
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=menicko-litomysl --branch=main
      # the site is already published; a red run makes GitHub email the owner about a broken restaurant
      - name: Fail when a restaurant could not be read
        run: |
          python -c "import json, sys; bad = [r['id'] for r in json.load(open('site/menus.json'))['restaurants'] if r['status'] != 'ok' or r.get('stale')]; print('not read:', bad or 'none'); sys.exit(bool(bad))"
