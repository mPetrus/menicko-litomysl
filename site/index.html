<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meníčko Litomyšl</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/grenze-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/grenze-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- roughens the edges of frames and name blocks so they read as cut wood, not CSS boxes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="cut"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  </svg>
  <header>
    <div class="band">
      <div class="masthead">
        <h1>Meníčko Litomyšl</h1>
        <p class="updated" id="updated"></p>
      </div>
      <input type="search" id="search" aria-label="Hledat jídlo" placeholder="Hledat jídlo" autocomplete="off">
    </div>
    <nav id="days" aria-label="Dny"></nav>
  </header>
  <main id="menus"><p class="note">Načítám menu…</p></main>
  <p class="empty" id="empty" aria-live="polite" hidden>Nic nenalezeno.</p>
  <footer>
    <p>Menu se přebírají z webů restaurací. Ceny a nabídku vždy ověřte u restaurace.</p>
    <details class="contact">
      <summary>Napište nám</summary>
      <form id="contact" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="959502bd-9044-4449-836e-18aeb983b6ac">
        <input type="hidden" name="subject" value="Meníčko Litomyšl – zpráva z webu">
        <!-- trap for bots: hidden from people, a filled box makes Web3Forms drop the message -->
        <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off">
        <label for="contact-email">Váš e-mail</label>
        <input type="email" id="contact-email" name="email" required autocomplete="email">
        <label for="contact-message">Zpráva</label>
        <textarea id="contact-message" name="message" required rows="4"></textarea>
        <button type="submit">Odeslat</button>
        <p id="contact-status" class="note" aria-live="polite"></p>
        <p class="contact-note">Zprávu doručuje služba Web3Forms.</p>
      </form>
    </details>
  </footer>
  <script src="app.js"></script>
</body>
</html>
